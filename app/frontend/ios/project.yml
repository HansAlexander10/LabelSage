# XcodeGen spec for the LabelSage iPhone app: `cd app/frontend/ios && xcodegen generate` -> LabelSage.xcodeproj
# The generated project is committed, so a fresh clone opens and runs without XcodeGen. Run `xcodegen generate`
# again only after changing this file. Source folders are Xcode 16 synced folders: new files need no regeneration.
# iOS 27 (register D-29), Swift 6 language mode, main actor by default, approachable concurrency.
# Bundle ID is a placeholder until the team picks one.
name: LabelSage
options:
  bundleIdPrefix: app.labelsage
  projectFormat: xcode16_0
  deploymentTarget:
    iOS: "27.0"
packages:
  LabelSageCore:
    path: ../../shared/LabelSageCore
  # The on-device catalog (catalog.sqlite from app/backend/etl) and the chat agent's model reader.
  LabelSageCatalog:
    path: ../../shared/LabelSageCatalog
  LabelSageAgent:
    path: ../../shared/LabelSageAgent
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    DEVELOPMENT_TEAM: ""
    # TestFlight: testflight.sh sets the team and a new build number on the command line.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LabelSage:
    type: application
    platform: iOS
    sources:
      - path: LabelSage
        type: syncedFolder
        excludes: ["Info.plist", "Resources/Mascot/**", "Resources/ProductImages/**"]
      - path: LabelSage/Resources/Mascot
        type: folder
        buildPhase: resources
      # Rendered pack photos for the fixture products, one <barcode>.jpg each.
      - path: LabelSage/Resources/ProductImages
        type: folder
        buildPhase: resources
    dependencies:
      - package: LabelSageCore
      - package: LabelSageCatalog
      - package: LabelSageAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.labelsage.ios
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # Release archives sign automatically with the team passed as DEVELOPMENT_TEAM (testflight.sh).
        Release:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGNING_REQUIRED: YES
    info:
      path: LabelSage/Info.plist
      properties:
        CFBundleDisplayName: LabelSage
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Export compliance: no custom or non-exempt encryption, so TestFlight skips the question.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.food-and-drink
        UILaunchScreen: {}
        UIAppFonts: [Outfit-VariableFont_wght.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The tokens have light values only (contrast audit 2026-10-27): system text must not turn white.
        UIUserInterfaceStyle: Light
        NSCameraUsageDescription: "LabelSage uses the camera to read barcodes and ingredient lists."
        NSMicrophoneUsageDescription: "LabelSage listens when you tap the mic and turns what you say into a message, on your iPhone."
        NSSpeechRecognitionUsageDescription: "LabelSage turns what you say into text on your iPhone. Nothing is sent anywhere."
        NSLocationWhenInUseUsageDescription: "LabelSage uses your location once to fill in your ZIP code. Only the ZIP code is kept, on your iPhone."
  LabelSageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LabelSageTests
        type: syncedFolder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LabelSage
  LabelSageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LabelSageUITests
        type: syncedFolder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LabelSage
schemes:
  LabelSage:
    build:
      targets:
        LabelSage: all
        LabelSageTests: [test]
        LabelSageUITests: [test]
    test:
      targets: [LabelSageTests, LabelSageUITests]
    run:
      # Debug launch switches: tick one in Edit Scheme > Run > Arguments (kept here so xcodegen keeps them).
      commandLineArguments:
        "-gallery": false
        "-verdictDebug": false
        # On by default so Run opens chat home with Alex and Mia (in memory); untick to see onboarding.
        "-demoHousehold": true
        # Direct screenshots: onboarding, chat, scan, product, compareWith, compare, family.
        "-screen family": false
        # Fresh onboarding on the real store: untick -demoHousehold and tick -resetHousehold.
        "-resetHousehold": false
        # Prints the household read back from the store (launch and every save) to the console.
        "-dumpHousehold": false
        # Answers onboarding by itself (the family of two from the onboarding brief), then saves.
        "-onboardingScript family": false
        # Timings in the `perf` log category (spike-ui-performance-2026-10-27.md); signposts are always on.
        "-perfLog": false
        # Fake network delay in ms for the fixture source; 0 turns it off (default 300 to 600).
        "-fixtureLatency 0": false
  # Run opens onboarding from the start and saves to the real store (the stored household is wiped first).
  LabelSage Onboarding:
    build:
      targets:
        LabelSage: all
    run:
      commandLineArguments:
        "-resetHousehold": true
        "-dumpHousehold": true
