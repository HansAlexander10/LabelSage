# XcodeGen spec for the LabelSage iPhone app: `cd app/frontend/ios && xcodegen generate` -> LabelSage.xcodeproj
# iOS 27 (register D-29), Swift 6 language mode, main actor by default, approachable concurrency.
# Bundle ID is a placeholder until the team picks one.
name: LabelSage
options:
  bundleIdPrefix: app.labelsage
  deploymentTarget:
    iOS: "27.0"
packages:
  LabelSageCore:
    path: ../../shared/LabelSageCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    DEVELOPMENT_TEAM: ""
targets:
  LabelSage:
    type: application
    platform: iOS
    sources:
      - path: LabelSage
        excludes: ["Resources/Mascot/**"]
      - path: LabelSage/Resources/Mascot
        type: folder
        buildPhase: resources
    dependencies:
      - package: LabelSageCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.labelsage.ios
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: LabelSage/Info.plist
      properties:
        CFBundleDisplayName: LabelSage
        UILaunchScreen: {}
        UIAppFonts: [Outfit-VariableFont_wght.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "LabelSage uses the camera to read barcodes and ingredient lists."
  LabelSageTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LabelSageTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LabelSage
  LabelSageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LabelSageUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LabelSage
schemes:
  LabelSage:
    build:
      targets:
        LabelSage: all
        LabelSageTests: [test]
        LabelSageUITests: [test]
    test:
      targets: [LabelSageTests, LabelSageUITests]
    run:
      # Debug launch switches: tick one in Edit Scheme > Run > Arguments (kept here so xcodegen keeps them).
      commandLineArguments:
        "-gallery": false
        "-verdictDebug": false
        # On by default so Run opens chat home with Alex and Mia (in memory); untick to see onboarding.
        "-demoHousehold": true
        # Direct screenshots: onboarding, chat, scan, product, compareWith, compare, family.
        "-screen family": false
        # Fresh onboarding on the real store: untick -demoHousehold and tick -resetHousehold.
        "-resetHousehold": false
        # Prints the household read back from the store (launch and every save) to the console.
        "-dumpHousehold": false
        # Answers onboarding by itself (the family of two from the onboarding brief), then saves.
        "-onboardingScript family": false
        # Timings in the `perf` log category (spike-ui-performance-2026-10-27.md); signposts are always on.
        "-perfLog": false
        # Fake network delay in ms for the fixture source; 0 turns it off (default 300 to 600).
        "-fixtureLatency 0": false
  # Run opens onboarding from the start and saves to the real store (the stored household is wiped first).
  LabelSage Onboarding:
    build:
      targets:
        LabelSage: all
    run:
      commandLineArguments:
        "-resetHousehold": true
        "-dumpHousehold": true
