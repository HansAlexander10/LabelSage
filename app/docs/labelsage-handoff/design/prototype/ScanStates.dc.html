<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan states</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/aishoppingagent/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
@import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap");body{margin:0;font-family:"Outfit","SF Pro Rounded",ui-rounded,-apple-system,system-ui,sans-serif}
@keyframes flag-bad{0%{box-shadow:0 0 0 0 rgba(239,75,63,.6)}70%{box-shadow:0 0 0 14px rgba(239,75,63,0)}100%{box-shadow:0 0 0 0 rgba(239,75,63,0)}}
@keyframes flag-careful{0%{box-shadow:0 0 0 0 rgba(255,212,73,.65)}70%{box-shadow:0 0 0 14px rgba(255,212,73,0)}100%{box-shadow:0 0 0 0 rgba(255,212,73,0)}}
@keyframes flag-good{0%{box-shadow:0 0 0 0 rgba(29,191,115,.55)}70%{box-shadow:0 0 0 14px rgba(29,191,115,0)}100%{box-shadow:0 0 0 0 rgba(29,191,115,0)}}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes scan-line{0%{top:12%}50%{top:84%}100%{top:12%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sk{0%{background-position:-240px 0}100%{background-position:240px 0}}
.scan-line{position:absolute;left:8%;right:8%;height:2px;border-radius:1px;background:#1dbf73;box-shadow:0 0 12px #1dbf73;animation:scan-line 1.6s ease-in-out infinite}
.spin{animation:spin .9s linear infinite}
.sk{border-radius:6px;background:linear-gradient(90deg,#ececf0 0%,#dedee3 40%,#ececf0 80%);background-size:480px 12px;animation:sk 1.4s linear infinite}
@media (prefers-reduced-motion:reduce){.scan-line,.spin,.sk{animation:none}}
:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1)}button,a{-webkit-tap-highlight-color:transparent;transition:transform 160ms var(--ease-out),background-color 160ms var(--ease-out)}button:active,a:active{transform:scale(0.97)}[role=radio]:active,[role=checkbox]:active,[role=option]:active,[role=menuitem]:active,[role=switch]:active{transform:none;background-color:rgba(118,118,128,0.12) !important}::selection{background:rgba(38,131,78,0.22)}@keyframes rc-sheet{from{transform:translateY(100%)}to{transform:none}}@keyframes rc-scrim{from{opacity:0}to{opacity:1}}@keyframes rc-pop{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:none}}.rc-sheet{animation:rc-sheet 420ms var(--ease-drawer) both}.rc-scrim{animation:rc-scrim 220ms var(--ease-out) both}.rc-pop{animation:rc-pop 180ms var(--ease-out) both}@media (prefers-reduced-motion:reduce){button:active,a:active{transform:none}.rc-sheet,.rc-pop{animation:rc-scrim 200ms ease both}}@media (prefers-reduced-transparency:reduce){[style*=backdrop-filter]{backdrop-filter:none !important;-webkit-backdrop-filter:none !important}}</style>
<style>/* Liquid Glass (navigation layer only, per HIG). Frosted base everywhere; refraction where backdrop SVG filters work (Chromium). */:root{--lg-bg:rgba(255,255,255,0.52);--lg-bg-thick:rgba(255,255,255,0.8);--lg-bg-dark:rgba(255,255,255,0.14);--lg-edge:rgba(255,255,255,0.7);--lg-edge-dark:rgba(255,255,255,0.3);--lg-fx:blur(14px) saturate(180%);--lg-shadow:inset 0 0 2px 1px rgba(255,255,255,0.6),inset 0 0 10px 4px rgba(255,255,255,0.22),inset 0 4px 16px rgba(17,17,26,0.05),inset 0 8px 24px rgba(17,17,26,0.05),0 6px 20px rgba(0,0,0,0.10);--lg-shadow-float:inset 0 0 2px 1px rgba(255,255,255,0.6),inset 0 0 10px 4px rgba(255,255,255,0.22),0 12px 36px rgba(0,0,0,0.16);--lg-shadow-dark:inset 0 0 2px 1px rgba(255,255,255,0.35),inset 0 0 10px 4px rgba(255,255,255,0.12),0 6px 20px rgba(0,0,0,0.25)}@supports (not (font:-apple-system-body)) and (not (-moz-appearance:none)){:root{--lg-fx:url(#lg-filter) blur(2px) saturate(1.7)}}@media (prefers-reduced-transparency:reduce){:root{--lg-bg:rgba(255,255,255,0.97);--lg-bg-thick:#ffffff;--lg-bg-dark:rgba(44,44,46,0.94);--lg-fx:none}}@media (prefers-contrast:more){:root{--lg-edge:rgba(0,0,0,0.35);--lg-edge-dark:rgba(255,255,255,0.7)}}</style>
</helmet>
<div style="width: 1760px; height: 960px; box-sizing: border-box; padding: 40px; background: #ffffff; display: flex; gap: 40px">
  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 15px; font-weight: 600; color: #26834e">1 · Nothing in frame</div>
    <div style="width: 390px; height: 844px; border-radius: 44px; overflow: hidden"><dc-import name="Scan" phase="idle" hold="{{yes}}" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 15px; font-weight: 600; color: #26834e">2 · Barcode found, checking</div>
    <div style="width: 390px; height: 844px; border-radius: 44px; overflow: hidden"><dc-import name="Scan" phase="loading" hold="{{yes}}" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 15px; font-weight: 600; color: #26834e">3 · Product</div>
    <div style="width: 390px; height: 844px; border-radius: 44px; overflow: hidden"><dc-import name="Scan" phase="product" hold="{{yes}}" hint-size="390px,844px"></dc-import></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 15px; font-weight: 600; color: #26834e">4 · No barcode: photo the ingredients</div>
    <div style="width: 390px; height: 844px; border-radius: 44px; overflow: hidden"><dc-import name="Scan" phase="idle" mode="label" hold="{{yes}}" hint-size="390px,844px"></dc-import></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1760,"height":960}}'>
class Component extends DCLogic { renderVals() { return { yes: true }; } }
</script>
</body>
</html>
